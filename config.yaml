# 섹터를 무엇으로 볼지: index(KRX 업종지수, 권장) 또는 etf
sector_mode: index
lookback_days: 300

# ── 섹터 = KRX 코스피 업종지수 코드 (sector_mode: index 일 때 사용)
#    코드가 바뀌었는지 확인하려면: LIST_INDICES=1 python main.py
sectors_index:
  음식료품:    "1005"
  화학:        "1008"
  의약품:      "1009"
  철강금속:    "1011"
  기계:        "1012"
  전기전자:    "1013"
  의료정밀:    "1014"
  운수장비:    "1015"
  유통업:      "1016"
  전기가스업:  "1017"
  건설업:      "1018"
  운수창고업:  "1019"
  통신업:      "1020"
  은행:        "1022"
  증권:        "1024"
  보험:        "1025"
  서비스업:    "1026"

# ── 섹터 = 대표 ETF (sector_mode: etf 일 때 사용, 코드 검증 필요)
sectors_etf:
  반도체:      "091160"
  자동차:      "091180"
  은행:        "091170"
  증권:        "102970"
  건설:        "117700"
  철강:        "117680"
  에너지화학:  "117460"
  헬스케어:    "266420"
  2차전지:     "305720"
  방산:        "449450"

# ── 내가 직접 넣는 관심종목 (항상 점검됨)
watchlist:
  삼성전자:    "005930"
  SK하이닉스:  "000660"
  현대차:      "005380"

# ── 관심종목 자동 편입 규칙
auto_watchlist:
  candidates_by_cap: 10   # 주도 섹터 구성종목 중 시가총액 상위 몇 개를 후보로
  pick_top: 5             # 후보 중 3M 수익률 상위 몇 개를 편입
  remove_after_weeks: 2   # '주도 약화'가 연속 N주 뜨면 제외 후보로

# ── 시그널 임계값
signals:
  top_n: 3
  rank_jump_1w: 4
  rank_jump_1m: 3
  rank_jump_3m: 3
  volume_surge_ratio: 1.5
  volume_dry_ratio: 0.6
  supply_wall_bins: 24
  cross_lookback: 5
